# Agent Engine — Default Security & Guardrail Policy Rules
# Evaluated by core/safety/policy.py on all tool calls

version: "1.0.0"
name: "Default Agent Engine Safety Guardrails"
description: "Core safety boundaries protecting infrastructure, secrets, and data integrity."

rules:
  - id: "k8s_prod_namespace_delete"
    name: "Kubernetes Production Namespace Deletion Protection"
    description: "Blocks destructive deletion of production Kubernetes namespaces."
    match_type: "regex"
    pattern: "(?i)kubectl\\s+(?:--?[a-zA-Z0-9_-]+\\s+)*delete\\s+namespace\\s+(?:prod|production|prod-[a-zA-Z0-9_-]+)"
    action: "block"
    risk_level: "critical"
    reason: "Deleting a production Kubernetes namespace causes immediate cluster-wide production downtime."
    suggestion: "kubectl rollout restart deployment/<deployment_name> -n <namespace>"

  - id: "destructive_fs_rm_root"
    name: "Filesystem Root Directory Deletion Shield"
    description: "Blocks recursive deletion of system root or root wildcards."
    match_type: "regex"
    pattern: "(?i)rm\\s+-[a-zA-Z]*r[a-zA-Z]*f?\\s+(?:/|/\\*)"
    action: "block"
    risk_level: "critical"
    reason: "Executing rm -rf / permanently wipes system operating files."
    suggestion: "rm -i <specific_file_path>"

  - id: "destructive_fs_rm_all"
    name: "Filesystem Unbounded Wildcard Deletion Shield"
    description: "Blocks recursive deletion of all current directory files via wildcard."
    match_type: "regex"
    pattern: "(?i)rm\\s+-[a-zA-Z]*r[a-zA-Z]*f?\\s+\\*(?:/.*)?"
    action: "block"
    risk_level: "critical"
    reason: "Unbounded recursive deletion with wildcard threatens entire directories."
    suggestion: "Specify exact file names or paths instead of wildcard *"

  - id: "destructive_format_disk"
    name: "Disk Formatting and Raw Write Protection"
    description: "Blocks raw device writes or filesystem creation on block devices."
    match_type: "regex"
    pattern: "(?i)(?:mkfs|fdisk|parted|dd\\s+if=.*\\s+of=/dev/)"
    action: "block"
    risk_level: "critical"
    reason: "Raw disk manipulation destroys partitions and filesystem superblocks."
    suggestion: "Inspect partitions using lsblk or df -h without raw device modifications"

  - id: "db_drop_prod"
    name: "Production Database Drop Protection"
    description: "Blocks destructive DROP or TRUNCATE statements on production databases."
    match_type: "regex"
    pattern: "(?i)(?:DROP\\s+DATABASE|DROP\\s+SCHEMA|TRUNCATE\\s+TABLE)\\s+[a-zA-Z0-9_]*prod"
    action: "block"
    risk_level: "critical"
    reason: "Dropping production databases or tables leads to unrecoverable data loss."
    suggestion: "Use database migrations with safe schema alteration scripts"

  - id: "secrets_env_access"
    name: "Secret & Credential File Shield"
    description: "Blocks direct read or modification of sensitive private keys and credentials."
    match_type: "glob"
    pattern: "**/{.env*,.aws/credentials,id_rsa,id_ecdsa,*.pem,*.key,*.p12}"
    action: "block"
    risk_level: "high"
    reason: "Direct exposure or modification of secret keys compromises system authentication."
    suggestion: "Access configuration through approved environment variables or secret vaults"

  - id: "git_force_push"
    name: "Git Master/Main Force Push Shield"
    description: "Blocks force-pushing to master or main branch."
    match_type: "regex"
    pattern: "(?i)git\\s+push\\s+(?:--force|-f)\\s+.*(?:master|main)"
    action: "block"
    risk_level: "high"
    reason: "Force pushing to master or main overwrites shared git history and commits."
    suggestion: "Rebase or create a pull request with non-destructive merge"

  - id: "dangerous_system_change"
    name: "System Package or Firewall Modification"
    description: "Requires staging and explicit confirmation for package installations and firewall edits."
    match_type: "regex"
    pattern: "(?i)(?:sudo\\s+)?(?:apt-get\\s+install|yum\\s+install|pacman\\s+-S|ufw\\s+allow|iptables\\s+-A)"
    action: "stage"
    risk_level: "high"
    reason: "System-level package changes require administrator staging (Conflict C6)."
    suggestion: "Stage changes in sandbox or container environment before host execution"
