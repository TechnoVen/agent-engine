[project]
name = "agent-engine"
version = "0.1.0"
description = "Agent Engine — Cross-platform, local-first, multi-agent studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dspy>=3.3.0",
    "fastapi>=0.115.0",
    "fastmcp>=3.4.0",
    "chromadb>=1.5.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.0",
    "psutil>=6.0.0",
    "watchdog>=5.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "rich>=14.0.0",
    "keyring>=25.0.0",
    "alembic>=1.19.2",
    "sqlalchemy>=2.0.52",
    "mcp<2",
    "pathspec>=0.12.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.uv.workspace]
members = [
    "services/python",
    "packages/sdk-python",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741", "W291", "W293"]
