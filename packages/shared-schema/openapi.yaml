openapi: 3.1.0
info:
  title: Agent Engine Local API
  description: Local HTTP and SSE interface between Agent Engine Tauri Shell and Python Sidecar
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8765/v1
    description: Local sidecar instance
paths:
  /chat/completions:
    post:
      summary: Send a chat prompt and receive a stream or direct response
      operationId: chatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streaming SSE response or completed JSON message
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  /events:
    get:
      summary: Subscribe to global server-sent events
      operationId: streamEvents
      responses:
        '200':
          description: Real-time event stream
          content:
            text/event-stream:
              schema:
                type: string

  /agents:
    get:
      summary: List all available and active agents
      operationId: listAgents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentInfo'

  /skills:
    get:
      summary: List installed skills and templates
      operationId: listSkills
      responses:
        '200':
          description: List of skills and templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillInfo'
    post:
      summary: Execute a specific skill or template
      operationId: executeSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSkillRequest'
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteSkillResponse'

  /skills/validate:
    post:
      summary: Validate skill content or frontmatter
      operationId: validateSkillContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSkillRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSkillResponse'

  /skills/create:
    post:
      summary: Create a new skill
      operationId: createSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillRequest'
      responses:
        '200':
          description: Created skill info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInfo'

  /skills/search:
    get:
      summary: Full-text search across discovered skills
      operationId: searchSkills
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Search results with relevance scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillSearchResult'

  /skills/collections:
    get:
      summary: List all skill collections
      operationId: listSkillCollections
      parameters:
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of skill collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillCollectionInfo'
    post:
      summary: Create a new skill collection
      operationId: createSkillCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillCollectionRequest'
      responses:
        '200':
          description: Created collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCollectionInfo'

  /skills/collections/{collection_id}:
    get:
      summary: Get details of a skill collection
      operationId: getSkillCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Collection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCollectionInfo'
    put:
      summary: Update a skill collection
      operationId: updateSkillCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillCollectionRequest'
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCollectionInfo'
    delete:
      summary: Delete a skill collection
      operationId: deleteSkillCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                type: object

  /skills/collections/{collection_id}/skills:
    get:
      summary: List member skills of a collection
      operationId: getCollectionMemberSkills
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillInfo'
    post:
      summary: Add a skill to a collection
      operationId: addSkillToCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSkillToCollectionRequest'
      responses:
        '200':
          description: Confirmation
          content:
            application/json:
              schema:
                type: object

  /skills/collections/{collection_id}/skills/{skill_id}:
    delete:
      summary: Remove a skill from a collection
      operationId: removeSkillFromCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removal confirmation
          content:
            application/json:
              schema:
                type: object

  /skills/registry:
    get:
      summary: List available registry skills
      operationId: listRegistrySkills
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Registry packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillRegistryPackageInfo'

  /skills/registry/install:
    post:
      summary: Install a skill from registry
      operationId: installRegistrySkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallSkillPackageRequest'
      responses:
        '200':
          description: Installed package info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRegistryPackageInfo'

  /skills/registry/uninstall:
    post:
      summary: Uninstall a skill from registry
      operationId: uninstallRegistrySkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UninstallSkillPackageRequest'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object

  /skills/remote/discover:
    post:
      summary: Discover skills on remote host or manifest
      operationId: discoverRemoteSkills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteSkillDiscoverRequest'
      responses:
        '200':
          description: List of discovered remote skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillInfo'

  /skills/remote/import:
    post:
      summary: Import and persist a remote skill locally
      operationId: importRemoteSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteSkillImportRequest'
      responses:
        '200':
          description: Imported skill info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInfo'

  /skills/{skill_id}:
    get:
      summary: Get details and content of a skill
      operationId: getSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Skill details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInfo'
    put:
      summary: Update a skill in place
      operationId: updateSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillRequest'
      responses:
        '200':
          description: Updated skill info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillInfo'
    delete:
      summary: Delete a skill
      operationId: deleteSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                type: object

  /workflows:
    get:
      summary: List registered workflows
      operationId: listWorkflows
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowInfo'
    post:
      summary: Run a workflow
      operationId: runWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunWorkflowRequest'
      responses:
        '200':
          description: Workflow execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'

  /workflows/validate:
    post:
      summary: Validate a workflow definition
      operationId: validateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                definition_yaml:
                  type: string
                definition_json:
                  type: object
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  node_count:
                    type: integer
                  edge_count:
                    type: integer

  /workflows/{workflow_id}:
    get:
      summary: Get workflow definition by ID
      operationId: getWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInfo'
    put:
      summary: Update workflow definition
      operationId: updateWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated workflow definition
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Delete workflow
      operationId: deleteWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion status
          content:
            application/json:
              schema:
                type: object

  /workflows/{workflow_id}/dry-run:
    post:
      summary: Dry run workflow execution
      operationId: dryRunWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
      responses:
        '200':
          description: Dry run result
          content:
            application/json:
              schema:
                type: object

  /workflows/{workflow_id}/run:
    post:
      summary: Execute workflow
      operationId: executeWorkflow
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                dry_run:
                  type: boolean
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                type: object

  /workflows/{workflow_id}/runs:
    get:
      summary: List workflow execution runs
      operationId: listWorkflowRuns
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of execution runs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /workflows/{workflow_id}/runs/{run_id}:
    get:
      summary: Get workflow run details
      operationId: getWorkflowRun
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                type: object

  /workflows/{workflow_id}/runs/{run_id}/approve:
    post:
      summary: Approve workflow gate
      operationId: approveWorkflowGate
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewer:
                  type: string
      responses:
        '200':
          description: Resumed run
          content:
            application/json:
              schema:
                type: object

  /workflows/{workflow_id}/runs/{run_id}/reject:
    post:
      summary: Reject workflow gate
      operationId: rejectWorkflowGate
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewer:
                  type: string
      responses:
        '200':
          description: Resumed or cancelled run
          content:
            application/json:
              schema:
                type: object

  /pipelines:
    get:
      summary: List registered modular DSPy agent pipelines
      operationId: listPipelines
      responses:
        '200':
          description: List of pipeline definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineInfo'

  /pipelines/{name}:
    get:
      summary: Get metadata for a specific pipeline
      operationId: getPipelineDetails
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pipeline metadata details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineInfo'
        '404':
          description: Pipeline not found

  /pipelines/{name}/run:
    post:
      summary: Execute a registered DSPy agent pipeline
      operationId: runPipeline
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
      responses:
        '200':
          description: Pipeline execution output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunResponse'
        '404':
          description: Pipeline not found

  /memory:
    get:
      summary: Query memory via semantic vector search
      operationId: queryMemory
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: top_k
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Retrieved memory passages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryQueryResponse'
    post:
      summary: Ingest document into vector memory
      operationId: ingestMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestMemoryRequest'
      responses:
        '200':
          description: Ingestion confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestMemoryResponse'

  /memory/observe:
    post:
      summary: Record an atomic observation, user preference, or project fact into observational memory
      operationId: recordObservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationRecordRequest'
      responses:
        '200':
          description: Observation recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationRecordResponse'

  /memory/observations:
    get:
      summary: Retrieve observations scored by semantic relevance, importance, and temporal decay
      operationId: queryObservations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: top_k
          in: query
          schema:
            type: integer
            default: 5
        - name: alpha
          in: query
          schema:
            type: number
            default: 0.5
        - name: beta
          in: query
          schema:
            type: number
            default: 0.3
        - name: gamma
          in: query
          schema:
            type: number
            default: 0.2
        - name: decay_lambda
          in: query
          schema:
            type: number
            default: 0.05
      responses:
        '200':
          description: Scored observations matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationQueryResponse'

  /patches:
    get:
      summary: List staged code patches
      operationId: listPatches
      responses:
        '200':
          description: Staged patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatchInfo'
  /patches/{patch_id}/apply:
    post:
      summary: Apply a staged patch by ID
      operationId: applyPatch
      parameters:
        - name: patch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'

  /patches/{patch_id}/reject:
    post:
      summary: Reject a staged patch by ID
      operationId: rejectPatch
      parameters:
        - name: patch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'

  /telemetry:
    get:
      summary: Get hardware resource telemetry and model router status
      operationId: getTelemetry
      responses:
        '200':
          description: System telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'

  /telemetry/hardware:
    get:
      summary: Get detailed real-time hardware telemetry and local model tokens/sec
      operationId: getHardwareTelemetry
      responses:
        '200':
          description: Hardware telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareTelemetryResponse'

  /telemetry/record-speed:
    post:
      summary: Record local model inference throughput (tokens/sec)
      operationId: recordInferenceSpeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedRecordRequest'
      responses:
        '200':
          description: Speed recording result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  tokens_per_second:
                    type: number
                  tokens:
                    type: integer
                  elapsed_seconds:
                    type: number
                  model:
                    type: string
                  runtime:
                    type: string

  /settings/config:
    get:
      summary: Retrieve current application configuration decrypted from encrypted vault
      operationId: getAppSettingsConfig
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettingsConfig'
    post:
      summary: Update and persist application configuration into local encrypted vault
      operationId: updateAppSettingsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettingsConfig'

  /diagnostics/export:
    get:
      summary: Export complete diagnostics bundle (.zip or JSON)
      operationId: exportDiagnostics
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [zip, json]
            default: zip
      responses:
        '200':
          description: Diagnostics export bundle
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsBundleResponse'

  /adapters:
    get:
      summary: List all registered agent adapters
      operationId: listAdapters
      parameters:
        - name: include_health
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of agent adapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdapterMetadata'

  /adapters/{adapter_id}:
    get:
      summary: Retrieve adapter metadata and health status
      operationId: getAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adapter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterMetadata'

  /adapters/{adapter_id}/execute:
    post:
      summary: Execute prompt through agent adapter
      operationId: executeAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterExecutionPayload'
      responses:
        '200':
          description: Adapter execution response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterExecutionResponse'

  /adapters/{adapter_id}/stream:
    post:
      summary: Stream tokens from agent adapter via SSE
      operationId: streamAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterExecutionPayload'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /adapters/{adapter_id}/test:
    post:
      summary: Probe adapter connectivity and health
      operationId: testAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adapter health probe results
          content:
            application/json:
              schema:
                type: object

