openapi: 3.1.0
info:
  title: Agent Engine Local API
  description: Local HTTP and SSE interface between Agent Engine Tauri Shell and Python Sidecar
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8765/v1
    description: Local sidecar instance
paths:
  /chat/completions:
    post:
      summary: Send a chat prompt and receive a stream or direct response
      operationId: chatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streaming SSE response or completed JSON message
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  /events:
    get:
      summary: Subscribe to global server-sent events
      operationId: streamEvents
      responses:
        '200':
          description: Real-time event stream
          content:
            text/event-stream:
              schema:
                type: string

  /agents:
    get:
      summary: List all available and active agents
      operationId: listAgents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentInfo'

  /skills:
    get:
      summary: List installed skills and templates
      operationId: listSkills
      responses:
        '200':
          description: List of skills and templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillInfo'
    post:
      summary: Execute a specific skill or template
      operationId: executeSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSkillRequest'
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteSkillResponse'

  /workflows:
    get:
      summary: List registered workflows
      operationId: listWorkflows
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowInfo'
    post:
      summary: Run a workflow
      operationId: runWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunWorkflowRequest'
      responses:
        '200':
          description: Workflow execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResponse'

  /pipelines:
    get:
      summary: List registered modular DSPy agent pipelines
      operationId: listPipelines
      responses:
        '200':
          description: List of pipeline definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineInfo'

  /pipelines/{name}:
    get:
      summary: Get metadata for a specific pipeline
      operationId: getPipelineDetails
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pipeline metadata details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineInfo'
        '404':
          description: Pipeline not found

  /pipelines/{name}/run:
    post:
      summary: Execute a registered DSPy agent pipeline
      operationId: runPipeline
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
      responses:
        '200':
          description: Pipeline execution output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunResponse'
        '404':
          description: Pipeline not found

  /memory:
    get:
      summary: Query memory via semantic vector search
      operationId: queryMemory
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: top_k
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Retrieved memory passages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryQueryResponse'
    post:
      summary: Ingest document into vector memory
      operationId: ingestMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestMemoryRequest'
      responses:
        '200':
          description: Ingestion confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestMemoryResponse'

  /memory/observe:
    post:
      summary: Record an atomic observation, user preference, or project fact into observational memory
      operationId: recordObservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationRecordRequest'
      responses:
        '200':
          description: Observation recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationRecordResponse'

  /memory/observations:
    get:
      summary: Retrieve observations scored by semantic relevance, importance, and temporal decay
      operationId: queryObservations
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: top_k
          in: query
          schema:
            type: integer
            default: 5
        - name: alpha
          in: query
          schema:
            type: number
            default: 0.5
        - name: beta
          in: query
          schema:
            type: number
            default: 0.3
        - name: gamma
          in: query
          schema:
            type: number
            default: 0.2
        - name: decay_lambda
          in: query
          schema:
            type: number
            default: 0.05
      responses:
        '200':
          description: Scored observations matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationQueryResponse'

  /patches:
    get:
      summary: List staged code patches
      operationId: listPatches
      responses:
        '200':
          description: Staged patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatchInfo'
  /patches/{patch_id}/apply:
    post:
      summary: Apply a staged patch by ID
      operationId: applyPatch
      parameters:
        - name: patch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'

  /patches/{patch_id}/reject:
    post:
      summary: Reject a staged patch by ID
      operationId: rejectPatch
      parameters:
        - name: patch_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'

  /telemetry:
    get:
      summary: Get hardware resource telemetry and model router status
      operationId: getTelemetry
      responses:
        '200':
          description: System telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'

  /telemetry/cost:
    get:
      summary: Get token usage and cost metrics
      operationId: getCostMetrics
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [agent, model, project, day]
            default: day
        - name: project
          in: query
          schema:
            type: string
        - name: agent_name
          in: query
          schema:
            type: string
        - name: model_name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Cost aggregation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostMetricsResponse'

  /telemetry/cost/record:
    post:
      summary: Record token spend ledger entry
      operationId: recordCostMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostRecordRequest'
      responses:
        '200':
          description: Recorded spend entry ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  success:
                    type: boolean

  /telemetry/budget:
    get:
      summary: Get project budget and active alerts
      operationId: getBudgetConfig
      parameters:
        - name: project
          in: query
          schema:
            type: string
            default: default
      responses:
        '200':
          description: Project budget and alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetConfigResponse'
    post:
      summary: Configure project budget limits and thresholds
      operationId: setBudgetConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetConfigRequest'
      responses:
        '200':
          description: Updated project budget configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetConfigResponse'

  /auth/session:
    get:
      summary: Get current authenticated session info
      operationId: getAuthSession
      responses:
        '200':
          description: User session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'

  /registry/search:
    get:
      summary: Search for skills or agent bundles in registry
      operationId: searchRegistry
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registry search results
          content:
            application/json:
              schema:
                type: array
                items:
  /flags:
    get:
      summary: Get current feature flag states
      operationId: getFeatureFlags
      responses:
        '200':
          description: Feature flag states and active overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagsResponse'

  /flags/{flag_name}:
    post:
      summary: Set runtime override for a feature flag
      operationId: setFeatureFlagOverride
      parameters:
        - name: flag_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: boolean
      responses:
        '200':
          description: Flag override result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'

  /safety/evaluate:
    post:
      summary: Evaluate prospective tool call against active safety policies
      operationId: evaluateSafety
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyEvaluationRequest'
      responses:
        '200':
          description: Safety evaluation decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyEvaluationResponse'

  /safety/policies:
    get:
      summary: List all active safety policies and guardrail rules
      operationId: listSafetyPolicies
      responses:
        '200':
          description: Active guardrail policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SafetyPolicyRuleInfo'

  /safety/audit:
    get:
      summary: List recent safety audit logs
      operationId: listSafetyAuditLogs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: decision
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Safety audit log history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogInfo'

  /safety/approval:
    post:
      summary: Submit human operator approval or rejection decision for a high-risk tool call
      operationId: submitSafetyApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Persistent audit log entry for the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogInfo'

  /sessions:
    post:
      summary: Create a unified cross-agent session
      operationId: createUnifiedSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSessionInfo'
    get:
      summary: List cross-agent sessions
      operationId: listUnifiedSessions
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnifiedSessionInfo'

  /sessions/search:
    get:
      summary: Search sessions and message content
      operationId: searchUnifiedSessions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSearchResult'

  /sessions/{session_id}:
    get:
      summary: Retrieve unified session by ID
      operationId: getUnifiedSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unified session with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSessionInfo'
        '404':
          description: Session not found
    patch:
      summary: Update unified session
      operationId: updateUnifiedSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSessionInfo'
    delete:
      summary: Delete a session
      operationId: deleteUnifiedSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session deleted

  /sessions/{session_id}/messages:
    post:
      summary: Append message to session
      operationId: appendUnifiedMessage
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '201':
          description: Appended message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedMessageInfo'

  /sessions/{session_id}/fork:
    post:
      summary: Fork session at specific message or latest
      operationId: forkUnifiedSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSessionRequest'
      responses:
        '201':
          description: Forked session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedSessionInfo'

  /sessions/{session_id}/export:
    get:
      summary: Export session transcript
      operationId: exportUnifiedSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            default: json
      responses:
        '200':
          description: Exported content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExportResponse'

  /sessions/import:
    post:
      summary: Import session from payload
      operationId: importUnifiedSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionImportRequest'
      responses:
        '201':
          description: Imported session
          content:
  /cache/lookup:
    post:
      summary: Lookup matching response from semantic cache
      operationId: lookupCache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheLookupRequest'
      responses:
        '200':
          description: Cache lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheLookupResponse'

  /cache/store:
    post:
      summary: Store query and response in semantic cache
      operationId: storeCache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheStoreRequest'
      responses:
        '201':
          description: Cache store confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStoreResponse'

  /cache/stats:
    get:
      summary: Retrieve semantic cache metrics and hit rates
      operationId: getCacheStats
      responses:
        '200':
          description: Cache telemetry statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'

  /cache/clear:
    post:
      summary: Clear or prune expired cache entries
      operationId: clearCache
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheClearRequest'
      responses:
        '200':
          description: Cache clear confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheClearResponse'

  /context/build:
    post:
      summary: Build minimal budgeted context enforcing limits and whitelisting
      operationId: buildContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextBuildRequest'
      responses:
        '200':
          description: Built and budget-enforced context payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextBuildResponse'

  /eval/run:
    post:
      summary: Run model evaluation suite and compute success-adjusted cost rankings
      operationId: runModelEval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunRequest'
      responses:
        '200':
          description: Model evaluation report and comparative rankings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResponse'

  /eval/rankings:
    get:
      summary: Retrieve success-adjusted cost rankings for a task type
      operationId: getEvalRankings
      parameters:
        - name: task_type
          in: query
          required: false
          schema:
            type: string
            default: classification
      responses:
        '200':
          description: Ranked models by cost-per-success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRankingResponse'

  /eval/benchmarks:
    get:
      summary: Retrieve historical benchmark runs from storage
      operationId: getEvalBenchmarks
      parameters:
        - name: task_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Historical evaluation benchmarks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalBenchmarksResponse'

  /router/route:
    post:
      summary: Classify agent step into optimal execution tier under 90/9/1 rule
      operationId: routeStep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteStepRequest'
      responses:
        '200':
          description: Resolved execution tier and target model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteStepResponse'

  /router/audit:
    post:
      summary: Audit workflow step sequence against Law 1 90/9/1 rule
      operationId: auditPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditPipelineRequest'
      responses:
        '200':
          description: Law 1 ratio compliance audit report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPipelineResponse'

  /router/tiers:
    get:
      summary: Retrieve execution tier models and 90/9/1 guidelines
      operationId: getRouterTiers
      responses:
        '200':
          description: Tier model mapping and guidelines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterTiersResponse'

  /credentials:
    get:
      summary: List stored credentials with values masked
      operationId: listCredentials
      parameters:
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: Optional service namespace filter
      responses:
        '200':
          description: List of stored credentials (masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialInfo'
    post:
      summary: Store a credential in secure storage
      operationId: setCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCredentialRequest'
      responses:
        '201':
          description: Credential saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInfo'

  /credentials/{service}/{key}:
    get:
      summary: Retrieve a stored credential (masked by default)
      operationId: getCredential
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: reveal
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Credential metadata and masked or revealed secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCredentialResponse'
        '404':
          description: Credential not found
    delete:
      summary: Delete a stored credential
      operationId: deleteCredential
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '404':
          description: Credential not found

  /credentials/test:
    post:
      summary: Test API authentication and connectivity for a model provider
      operationId: testCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCredentialRequest'
      responses:
        '200':
          description: Connectivity probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCredentialResponse'

  /updater/status:
    get:
      summary: Retrieve auto-updater status, current version, active channel, and feed URL
      operationId: getUpdaterStatus
      responses:
        '200':
          description: Auto-updater status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatusResponse'

  /updater/channel:
    post:
      summary: Switch active update distribution channel (stable, beta, nightly)
      operationId: setUpdaterChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetChannelRequest'
      responses:
        '200':
          description: Updated updater configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatusResponse'
        '400':
          description: Invalid channel specified

  /updater/check:
    post:
      summary: Check for new releases against the active or requested channel
      operationId: checkUpdates
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckRequest'
      responses:
        '200':
          description: Release update check outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckResponse'

