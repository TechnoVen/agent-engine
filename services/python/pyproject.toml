[project]
name = "agent-engine-sidecar"
version = "0.1.0"
description = "Agent Engine Python Sidecar Service (FastAPI + FastMCP + ACP)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "fastmcp>=3.4.0",
    "dspy>=3.3.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
