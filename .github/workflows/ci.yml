name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check code formatting (ruff format)
        run: uv run ruff format --check .

      - name: Run code linter (ruff check)
        run: uv run ruff check .

  test-python:
    name: Test Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit and integration tests
        run: uv run pytest tests/ -v

  schema-validation:
    name: OpenAPI & Schema Diff Validation
    needs: [lint-and-format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Validate OpenAPI spec parity and event schema
        run: uv run pytest tests/test_shared_schema.py tests/test_api_contract.py -v

  monorepo-workspaces:
    name: Monorepo Workspaces Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify workspace packages
        run: |
          node -e "const pkg = require('./package.json'); console.log('Root package:', pkg.name);"
          node -e "const desk = require('./apps/desktop/package.json'); console.log('Desktop package:', desk.name);"
          node -e "const sdk = require('./packages/sdk-js/package.json'); console.log('SDK JS package:', sdk.name);"
          node -e "const schema = require('./packages/shared-schema/package.json'); console.log('Shared schema package:', schema.name);"

  sidecar-bundling-and-signing:
    name: Sidecar Bundling & Cryptographic Signing (Task 2.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Bundle Python sidecar
        run: uv run python scripts/bundle_sidecar.py

      - name: Sign sidecar artifacts (Ed25519)
        run: uv run python scripts/sign_artifacts.py --sign

      - name: Verify signature and SHA-256 integrity
        run: uv run python scripts/sign_artifacts.py --verify

      - name: Run sidecar bundling test suite
        run: uv run pytest tests/test_sidecar_bundling.py -v

  auto-update-manifest-verification:
    name: Auto-Update Manifest & Signature Verification (Task 2.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate and sign update manifests
        run: uv run python scripts/generate_update_manifest.py --output-dir dist/updates --sign

      - name: Verify update manifests self-test
        run: uv run python scripts/generate_update_manifest.py --verify dist/updates/stable.json

      - name: Run auto-updater test suite
        run: uv run pytest tests/test_auto_updater.py -v

